<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일상속에 비트로</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #fcfbf9;
    --bg-sub: #ffffff;
    --black: #1a1a1a;
    --text-main: #2c3e2c;
    --text-muted: #809680;
    --green-grad: linear-gradient(135deg, #00f5a0 0%, #00d9e1 100%);
    --green-solid: #00c896;
    --green-dark: #004d3d;
    --border: #e0eae0;
    --red: #ff5252;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
  }

  /* ── GRID BG ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,200,150,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,150,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 40px 20px; }

  /* ── HEADER ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 30px;
    margin-bottom: 40px;
    border-bottom: 2px solid var(--border);
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    background: var(--green-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  .logo span { 
    color: var(--text-muted); 
    font-size: 0.5em; 
    display: block; 
    font-family: 'Noto Sans KR', sans-serif; 
    font-weight: 400;
    -webkit-text-fill-color: var(--text-muted);
  }

  /* ── CARDS ── */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 40px; }
  .info-card {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .info-card .ic-title {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--green-solid);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .info-card p { font-size: 13px; line-height: 1.6; color: var(--text-main); }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 8px;
    background: #f0f4f0;
    padding: 6px;
    border-radius: 100px;
    margin-bottom: 30px;
  }
  .tab {
    flex: 1; padding: 12px;
    font-size: 14px; font-weight: 700;
    background: none; border: none; border-radius: 100px;
    color: var(--text-muted); cursor: pointer; transition: all 0.3s;
  }
  .tab.active { background: var(--bg-sub); color: var(--green-solid); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

  /* ── VISUALIZER ── */
  .viz-wrap {
    background: var(--black);
    border-radius: var(--radius);
    padding: 15px;
    margin-bottom: 30px;
  }
  #canvas { width: 100%; height: 60px; display: block; }

  /* ── SOUND & VIDEO ── */
  .section-panel { display: none; }
  .section-panel.active { display: block; }

  .sound-slot {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: var(--shadow);
  }
  .slot-num { font-family: 'Space Mono', monospace; font-size: 20px; color: var(--green-solid); font-weight: 700; }
  .slot-info { flex: 1; }
  .slot-name { font-weight: 700; font-size: 15px; }
  .slot-status { font-size: 12px; color: var(--text-muted); }

  .btn-rec, .btn-vid {
    background: var(--green-grad);
    border: none; color: white; padding: 10px 20px;
    border-radius: 12px; font-weight: 700; cursor: pointer;
    font-family: 'Space Mono', monospace;
  }
  .btn-rec.recording { background: var(--red); animation: pulse 1s infinite; }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

  .video-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .video-box { 
    aspect-ratio: 9/16; background: #eee; border-radius: 12px; overflow: hidden; 
    border: 2px solid transparent;
  }
  .video-box.done { border-color: var(--green-solid); }
  video { width: 100%; height: 100%; object-fit: cover; }

  /* ── GENERATE BUTTON ── */
  .api-row { margin: 30px 0 15px; }
  .api-row input {
    width: 100%; padding: 15px; border-radius: 15px;
    border: 1px solid var(--border); background: var(--bg-sub);
    font-family: 'Space Mono', monospace;
  }

  .generate-btn {
    width: 100%; padding: 25px; border-radius: var(--radius);
    border: none; background: var(--green-grad); color: white;
    font-size: 18px; font-weight: 900; cursor: pointer;
    box-shadow: 0 15px 35px rgba(0,217,225,0.3);
  }

  /* ── PLAYBACK OVERLAY ── */
  #playOverlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.98);
    z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center;
  }
  #playOverlay.active { display: flex; }
  .play-cell { 
    width: 110px; border-radius: 15px; overflow: hidden; 
    border: 3px solid #eee; transition: all 0.2s; 
  }
  .play-cell.active { border-color: var(--green-solid); transform: scale(1.1); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">
      일상속에 비트로
      <span>AI Music & Visual Lab</span>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-card">
      <div class="ic-title">01. SOUND CAPTURE</div>
      <p>3초간 주변의 소리를 녹음하세요. Gemini가 악기 성격을 분석합니다.</p>
    </div>
    <div class="info-card">
      <div class="ic-title">02. VIDEO SYNC</div>
      <p>소리에 어울리는 영상을 찍으세요. 비트에 맞춰 자동 편집됩니다.</p>
    </div>
  </div>

  <div class="viz-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('sound', this)">🎤 소리 녹음</button>
    <button class="tab" onclick="switchTab('video', this)">📹 영상 촬영</button>
  </div>

  <div id="tab-sound" class="section-panel active">
    <div id="soundSlots"></div>
  </div>

  <div id="tab-video" class="section-panel">
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <div class="api-row">
    <input type="password" id="apiKey" placeholder="Gemini API Key를 입력하세요">
  </div>

  <button class="generate-btn" id="generateBtn" onclick="generateBeat()">
    비트 생성 및 재생 시작 →
  </button>

  <div id="logBox" style="margin-top:20px; font-size:11px; color:var(--text-muted); font-family:'Space Mono';"></div>
</div>

<div id="playOverlay">
  <h2 style="margin-bottom:30px; color:var(--green-solid)">BEAT PLAYING...</h2>
  <div class="play-grid" id="playGrid" style="display:flex; gap:10px;"></div>
  <button onclick="stopPlayback()" style="margin-top:40px; padding:15px 40px; border-radius:100px; border:1px solid #ccc; background:none; cursor:pointer;">STOP</button>
</div>

<script>
// ── STATE ──
const NUM = 5;
let audioRecordings = Array(NUM).fill(null);   // Blob
let videoRecordings = Array(NUM).fill(null);   // Blob
let analysisResults = Array(NUM).fill(null);   // { instrument, peak_ms, energy }
let beatPattern = null;                         // { bpm, sequence[] }
let audioCtx = null, analyser = null;
let playTimers = [];
let isRecordingAudio = Array(NUM).fill(false);
let isRecordingVideo = Array(NUM).fill(false);

// ── BUILD SLOTS ──
const soundSlots = document.getElementById('soundSlots');
const videoGrid  = document.getElementById('videoGrid');

const soundNames = ['소리 #1', '소리 #2', '소리 #3', '소리 #4', '소리 #5'];

for (let i = 0; i < NUM; i++) {
  // Sound slot
  soundSlots.insertAdjacentHTML('beforeend', `
    <div class="sound-slot" id="ss-${i}">
      <div class="slot-num">${i+1}</div>
      <div class="slot-info">
        <div class="slot-name" id="ss-name-${i}">${soundNames[i]}</div>
        <div class="slot-status" id="ss-status-${i}">대기 중...</div>
      </div>
      <div id="ss-badge-${i}" style="display:none" class="instrument-badge">-</div>
      <button class="btn-rec" id="ss-btn-${i}" onclick="recordAudio(${i})">REC</button>
    </div>
  `);

  // Video cell
  videoGrid.insertAdjacentHTML('beforeend', `
    <div class="video-cell">
      <div class="video-box" id="vb-${i}">
        <video id="vp-${i}" muted playsinline></video>
        <div class="rec-badge">REC</div>
        <div class="play-overlay" id="vov-${i}">🎥</div>
      </div>
      <div class="slot-label">영상 ${i+1}</div>
      <button class="btn-vid" id="vb-btn-${i}" onclick="recordVideo(${i})">촬영</button>
    </div>
  `);
}

// ── TAB SWITCH ──
function switchTab(name, el) {
  document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
}

// ── VISUALIZER ──
function initVisualizer() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  const data = new Uint8Array(analyser.frequencyBinCount);
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;

  function draw() {
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const W = canvas.width, H = canvas.height;
    const bw = W / data.length;
    data.forEach((v, i) => {
      const pct = v / 255;
      const h = pct * H;
      const g = ctx.createLinearGradient(0, H - h, 0, H);
      g.addColorStop(0, `rgba(0,255,127,${0.3 + pct * 0.7})`);
      g.addColorStop(1, 'rgba(0,80,40,0.2)');
      ctx.fillStyle = g;
      ctx.fillRect(i * bw + 1, H - h, bw - 2, h);
    });
  }
  draw();
}

// ── AUDIO RECORD ──
async function recordAudio(i) {
  if (isRecordingAudio[i]) return;
  isRecordingAudio[i] = true;
  const btn = document.getElementById(`ss-btn-${i}`);
  const slot = document.getElementById(`ss-${i}`);
  const status = document.getElementById(`ss-status-${i}`);
  btn.textContent = '3s...'; btn.classList.add('recording');
  slot.classList.add('recording'); slot.classList.remove('done');
  status.textContent = '녹음 중...'; status.className = 'slot-status';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    initVisualizer();
    // connect stream to visualizer
    const src = audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);

    const rec = new MediaRecorder(stream, { mimeType: getSupportedMimeType(['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']) });
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);

    // countdown
    let secs = 3;
    const tick = setInterval(() => {
      secs--;
      if (secs > 0) btn.textContent = `${secs}s...`;
    }, 1000);

    rec.onstop = () => {
      clearInterval(tick);
      stream.getTracks().forEach(t => t.stop());
      audioRecordings[i] = new Blob(chunks, { type: rec.mimeType });
      btn.textContent = '✓ 완료'; btn.classList.remove('recording'); btn.classList.add('done');
      slot.classList.remove('recording'); slot.classList.add('done');
      status.textContent = '녹음 완료 · AI 분석 대기'; status.className = 'slot-status ok';
      isRecordingAudio[i] = false;
    };

    rec.start();
    setTimeout(() => rec.stop(), 3000);
  } catch(e) {
    btn.textContent = '오류'; btn.classList.remove('recording');
    slot.classList.remove('recording');
    status.textContent = '마이크 권한 필요'; status.className = 'slot-status err';
    isRecordingAudio[i] = false;
  }
}

function getSupportedMimeType(types) {
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

// ── VIDEO RECORD ──
async function recordVideo(i) {
  if (isRecordingVideo[i]) return;
  isRecordingVideo[i] = true;
  const btn = document.getElementById(`vb-btn-${i}`);
  const box = document.getElementById(`vb-${i}`);
  const vid = document.getElementById(`vp-${i}`);
  const ov  = document.getElementById(`vov-${i}`);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 480 }, height: { ideal: 854 } },
      audio: true
    });
    vid.srcObject = stream;
    vid.play();
    box.classList.add('recording');
    btn.textContent = '촬영 중...';
    ov.style.display = 'none';

    const mimeType = getSupportedMimeType(['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']);
    const rec = new MediaRecorder(stream, { mimeType });
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);

    let secs = 3;
    btn.textContent = `촬영 중 ${secs}s`;
    const tick = setInterval(() => { secs--; if (secs >= 0) btn.textContent = `촬영 중 ${secs}s`; }, 1000);

    rec.onstop = () => {
      clearInterval(tick);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType });
      videoRecordings[i] = blob;
      vid.srcObject = null;
      vid.src = URL.createObjectURL(blob);
      vid.loop = true; vid.muted = true; vid.play();
      box.classList.remove('recording'); box.classList.add('done');
      ov.style.display = 'none';
      btn.textContent = '✓ 촬영 완료'; btn.classList.add('done');
      isRecordingVideo[i] = false;
    };

    rec.start();
    setTimeout(() => rec.stop(), 3000);
  } catch(e) {
    btn.textContent = '오류'; box.classList.remove('recording');
    ov.textContent = '카메라 권한 필요'; ov.style.display = 'flex';
    isRecordingVideo[i] = false;
  }
}

// ── LOGGING ──
function log(msg, type='') {
  const box = document.getElementById('logBox');
  box.classList.add('visible');
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  const ts = new Date().toLocaleTimeString('ko-KR', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
  line.textContent = `[${ts}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('btnProgress').style.width = pct + '%';
}

// ── BLOB TO BASE64 ──
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

// ── ANALYZE AUDIO WITH GEMINI ──
async function analyzeAudioWithGemini(blob, index, apiKey) {
  const b64 = await blobToBase64(blob);
  const mimeType = blob.type || 'audio/webm';

  const prompt = `You are an audio analysis AI for a music beat generator app.
Analyze this 3-second audio clip and return ONLY valid JSON (no markdown, no explanation):
{
  "instrument": "<Korean instrument name, e.g. 킥드럼, 스네어, 하이햇, 베이스, 박수, 목소리, 발걸음, 연필소리, etc>",
  "instrument_en": "<English role: kick | snare | hihat | bass | perc | vocal | fx>",
  "peak_ms": <integer millisecond 0-2500 where audio energy peaks, this is where 0.5s clip will start>,
  "energy": <float 0.0-1.0 overall loudness>,
  "description": "<Korean 1-sentence description of the sound>"
}`;

  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{
        parts: [
          { inline_data: { mime_type: mimeType, data: b64 } },
          { text: prompt }
        ]
      }],
      generationConfig: { temperature: 0.1, maxOutputTokens: 300, response_mime_type: "application/json" }
    })
  });

  if (!response.ok) throw new Error(`Gemini API Error: ${response.status}`);
  const data = await response.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ── DESIGN BEAT WITH GEMINI FLASH ──
async function designBeatWithGemini(analyses, apiKey) {
  const prompt = `You are a music producer AI. Given these 5 sound analyses, design a beat pattern.

Sounds: ${JSON.stringify(analyses)}

Return ONLY valid JSON (no markdown):
{
  "bpm": <integer 80-140>,
  "description": "<Korean 2-sentence description of the beat style>",
  "sequence": [
    {"step": 0, "sound_index": <0-4>, "beat_type": "<kick|snare|hihat|perc>", "velocity": <0.5-1.0>},
    ...
  ]
}

Rules:
- sequence should have 8-16 steps total for one loop
- step goes 0-15 (16-step grid, each = 1/16 note)
- Use the sound with instrument_en="kick" or most bass-like sound on steps 0,4,8,12
- Use snare-like sound on steps 4,12
- Use hihat-like sound on steps 2,6,10,14
- Fill remaining with other sounds creatively
- Make it a proper hip-hop or electronic beat`;

  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.4, maxOutputTokens: 800 , response_mime_type: "application/json"}
    })
  });

  if (!response.ok) throw new Error(`Gemini Flash API Error: ${response.status}`);
  const data = await response.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ── LOCAL PEAK EXTRACTION ──
async function extractPeakClip(blob, peakMs) {
  // We slice the blob time-based using OfflineAudioContext
  const arrayBuffer = await blob.arrayBuffer();
  const tempCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100 * 3, 44100);
  let decodedBuffer;
  try {
    decodedBuffer = await tempCtx.decodeAudioData(arrayBuffer);
  } catch (e) {
    // fallback: just return original blob sliced in time
    return blob;
  }

  // Extract 0.5s window starting at peakMs
  const sampleRate = decodedBuffer.sampleRate;
  const startSample = Math.floor((peakMs / 1000) * sampleRate);
  const clipSamples = Math.floor(0.5 * sampleRate);
  const endSample = Math.min(startSample + clipSamples, decodedBuffer.length);
  const actualSamples = endSample - startSample;

  const offCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
    decodedBuffer.numberOfChannels, actualSamples, sampleRate
  );
  const buf = offCtx.createBuffer(decodedBuffer.numberOfChannels, actualSamples, sampleRate);
  for (let ch = 0; ch < decodedBuffer.numberOfChannels; ch++) {
    buf.copyToChannel(decodedBuffer.getChannelData(ch).slice(startSample, endSample), ch);
  }
  const src = offCtx.createBufferSource();
  src.buffer = buf;
  src.connect(offCtx.destination);
  src.start();
  const rendered = await offCtx.startRendering();

  // Convert rendered buffer to WAV blob
  return audioBufferToWavBlob(rendered);
}

function audioBufferToWavBlob(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate  = buffer.sampleRate;
  const length      = buffer.length;
  const pcmData     = new Float32Array(length * numChannels);

  for (let ch = 0; ch < numChannels; ch++) {
    const channelData = buffer.getChannelData(ch);
    for (let i = 0; i < length; i++) pcmData[i * numChannels + ch] = channelData[i];
  }

  const dataLen = length * numChannels * 2; // 16-bit
  const ab = new ArrayBuffer(44 + dataLen);
  const view = new DataView(ab);

  const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataLen, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);           // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, dataLen, true);

  let offset = 44;
  for (let i = 0; i < pcmData.length; i++) {
    const s = Math.max(-1, Math.min(1, pcmData[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }
  return new Blob([ab], { type: 'audio/wav' });
}

// ── MAIN GENERATE ──
async function generateBeat() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { log('❌ Gemini API 키를 입력해줘!', 'err'); return; }

  const recorded = audioRecordings.filter(Boolean).length;
  if (recorded === 0) { log('❌ 소리를 최소 1개 이상 녹음해야 해!', 'err'); return; }

  const btn = document.getElementById('generateBtn');
  const label = document.getElementById('generateLabel');
  btn.disabled = true;
  label.textContent = '분석 중...';
  setProgress(5);

  initVisualizer();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const logBox = document.getElementById('logBox');
  logBox.innerHTML = '';

  log('🚀 비트 생성 시작!', 'info');

  // ── STEP 1: Analyze each audio with Gemini Pro ──
  const validIndices = [];
  for (let i = 0; i < NUM; i++) {
    if (!audioRecordings[i]) { analysisResults[i] = null; continue; }
    log(`🎤 소리 ${i+1} 분석 중... (Gemini 3 Flash)`, 'info');
    try {
      const result = await analyzeAudioWithGemini(audioRecordings[i], i, apiKey);
      analysisResults[i] = result;
      validIndices.push(i);
      // Update badge
      document.getElementById(`ss-badge-${i}`).textContent = result.instrument;
      document.getElementById(`ss-badge-${i}`).style.display = 'block';
      document.getElementById(`ss-status-${i}`).textContent = `${result.instrument} · 피크 ${result.peak_ms}ms`;
      log(`✅ 소리 ${i+1}: ${result.instrument} (피크 ${result.peak_ms}ms, 에너지 ${result.energy})`, 'ok');
      setProgress(5 + (i + 1) * 12);
    } catch(e) {
      log(`⚠ 소리 ${i+1} 분석 실패: ${e.message}`, 'err');
      analysisResults[i] = { instrument: '알수없음', instrument_en: 'perc', peak_ms: 0, energy: 0.5, description: '분석실패' };
      validIndices.push(i);
    }
  }

  setProgress(65);

  // ── STEP 2: Extract peak clips ──
  log('✂ 0.5초 피크 구간 추출 중...', 'info');
  const peakClips = Array(NUM).fill(null);
  for (const i of validIndices) {
    try {
      peakClips[i] = await extractPeakClip(audioRecordings[i], analysisResults[i].peak_ms);
      log(`✅ 소리 ${i+1} 피크 클립 추출 완료`, 'ok');
    } catch(e) {
      peakClips[i] = audioRecordings[i]; // fallback
      log(`⚠ 소리 ${i+1} 피크 추출 오류 (원본 사용)`, 'err');
    }
  }

  setProgress(75);

  // ── STEP 3: Design beat pattern ──
  log('🧠 Gemini Flash로 비트 패턴 설계 중...', 'info');
  const validAnalyses = validIndices.map(i => ({ ...analysisResults[i], index: i }));
  try {
    beatPattern = await designBeatWithGemini(validAnalyses, apiKey);
    log(`🎵 비트 완성! BPM: ${beatPattern.bpm} — ${beatPattern.description}`, 'ok');
  } catch(e) {
    log(`⚠ 비트 설계 실패, 기본 패턴 사용: ${e.message}`, 'err');
    // fallback pattern
    beatPattern = {
      bpm: 100,
      description: '기본 비트 패턴',
      sequence: validIndices.flatMap((idx, pos) =>
        [0,4,8,12].filter(s => s % NUM === pos).map(step => ({
          step, sound_index: idx, beat_type: 'perc', velocity: 0.8
        }))
      )
    };
  }

  setProgress(90);

  // ── STEP 4: Play! ──
  log('▶ 재생 시작!', 'info');
  label.textContent = '재생 중... ▶';

  await startPlayback(peakClips, beatPattern);

  setProgress(100);
  btn.disabled = false;
  label.textContent = '비트 & 영상 생성하기 →';
  setTimeout(() => setProgress(0), 1000);
}

// ── PLAYBACK ──
async function startPlayback(peakClips, pattern) {
  stopPlayback();

  // Build play overlay
  const grid = document.getElementById('playGrid');
  grid.innerHTML = '';
  for (let i = 0; i < NUM; i++) {
    if (!videoRecordings[i] && !audioRecordings[i]) continue;
    const cell = document.createElement('div');
    cell.className = 'play-cell';
    cell.id = `pc-${i}`;
    if (videoRecordings[i]) {
      const v = document.createElement('video');
      v.src = URL.createObjectURL(videoRecordings[i]);
      v.muted = false; v.loop = true; v.playsInline = true;
      v.style.aspectRatio = '9/16';
      cell.appendChild(v);
    }
    const label = document.createElement('div');
    label.className = 'beat-label';
    label.textContent = analysisResults[i]?.instrument || `#${i+1}`;
    cell.appendChild(label);
    grid.appendChild(cell);
  }

  document.getElementById('playOverlay').classList.add('active');

  // Prepare audio buffers
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const decodedBuffers = {};
  for (let i = 0; i < NUM; i++) {
    if (!peakClips[i]) continue;
    try {
      const ab = await peakClips[i].arrayBuffer();
      decodedBuffers[i] = await audioCtx.decodeAudioData(ab);
    } catch(e) { /* skip */ }
  }

  const bpm = pattern.bpm || 100;
  const stepMs = (60000 / bpm) / 4; // 16th note duration
  const loopSteps = 16;
  const loopMs = stepMs * loopSteps;

  function playLoop(startTime) {
    pattern.sequence.forEach(step => {
      const si = step.sound_index;
      const when = startTime + (step.step * stepMs) / 1000;
      const velocity = step.velocity || 0.8;

      // Audio
      if (decodedBuffers[si]) {
        const src = audioCtx.createBufferSource();
        src.buffer = decodedBuffers[si];
        const gain = audioCtx.createGain();
        gain.gain.value = velocity;
        src.connect(gain);
        gain.connect(analyser);
        src.start(when);
      }

      // Video highlight
      const delayMs = (when - audioCtx.currentTime) * 1000;
      const t = setTimeout(() => {
        highlightCell(si);
        const vid = document.querySelector(`#pc-${si} video`);
        if (vid) { vid.currentTime = 0; vid.play(); }
      }, Math.max(0, delayMs));
      playTimers.push(t);
    });

    // Schedule next loop
    const nextLoopDelay = (startTime + loopMs / 1000 - audioCtx.currentTime) * 1000 - 50;
    const t = setTimeout(() => playLoop(audioCtx.currentTime + 0.05), Math.max(0, nextLoopDelay));
    playTimers.push(t);
  }

  playLoop(audioCtx.currentTime + 0.1);
}

function highlightCell(i) {
  document.querySelectorAll('.play-cell').forEach(c => c.classList.remove('active'));
  const cell = document.getElementById(`pc-${i}`);
  if (cell) {
    cell.classList.add('active');
    setTimeout(() => cell.classList.remove('active'), 350);
  }
}

function stopPlayback() {
  playTimers.forEach(t => clearTimeout(t));
  playTimers = [];
  document.getElementById('playOverlay').classList.remove('active');
}
</script>
